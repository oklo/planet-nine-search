name: Tests
on:
  push:
    paths-ignore:
      - 'coordinator/coordination/snapshot.json'
  pull_request:
    paths-ignore:
      - 'coordinator/coordination/snapshot.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: p9 --help
