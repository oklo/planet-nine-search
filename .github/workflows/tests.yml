name: Tests
on:
  push:
    paths-ignore:
      - 'coordinator/coordination/snapshot.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PHP and SQLite
        run: |
          if command -v php >/dev/null && php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'; then
            exit 0
          fi
          apt_options=(-o Acquire::Retries=3)
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            apt_options+=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y php-cli php-sqlite3
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: node --test tests/*.mjs
      - run: pytest -q
      - run: python -m build
      - run: p9 --help
